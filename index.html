<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausritter - Главное меню</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div id="app-container" class="menu-container">
        <h1 class="menu-title">Mausritter</h1>
        <!-- Кнопки управления: 2x2 на ПК, 4x1 на мобильных -->
        <div class="menu-actions-grid">
            <button id="btn-new" class="btn-primary">Пустой лист</button>
            <button id="btn-generate" class="btn-primary">Сгенерировать</button>
            <label class="btn-primary menu-upload-label">
                Импорт
                <input type="file" id="file-import" accept=".json" style="display: none;">
            </label>
            <button id="btn-export" class="btn-primary">Экспорт</button>
        </div>
        <h2 class="menu-subtitle">Сохраненные персонажи</h2>
        <!-- Список персонажей -->
        <div id="char-list"></div>
    </div>
    <!-- Скрипты меню -->
    <script defer src="js/storage.js"></script>
    <script defer src="js/menu.js"></script>
</body>
</html>
